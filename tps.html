<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Tabella Dinamica DOM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            width: 300px;
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-container input {
            padding: 8px;
            font-size: 14px;
        }
        button {
            padding: 10px;
            background-color: #04AA6D;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #059862;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Inserimento Dati Persona</h2>

    <div class="form-container">
        <input type="text" id="nome" placeholder="Nome" value="cristian">
        <input type="text" id="cognome" placeholder="Cognome" value="piras">
        <input type="text" id="indirizzo" placeholder="Indirizzo" value="via elvezia">
        <input type="text" id="citta" placeholder="Città" value="parabiago">
        <input type="number" id="eta" placeholder="Età" value="17">
        
        <button onclick="aggiungiRiga()">Aggiungi alla tabella</button>
    </div>

    <table id="tabellaDati">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Indirizzo</th>
                <th>Città</th>
                <th>Età</th>
            </tr>
        </thead>
        <tbody>
            <!-- Le righe verranno inserite qui dinamicamente -->
        </tbody>
    </table>

    <script>
        function aggiungiRiga() {
            let nome = document.getElementById("nome").value;
            let cognome = document.getElementById("cognome").value;
            let indirizzo = document.getElementById("indirizzo").value;
            let citta = document.getElementById("citta").value;
            let eta = document.getElementById("eta").value;

            if (!nome || !cognome || !indirizzo || !citta || !eta) {
                alert("Compilare tutti i campi prima di inserire!");
                return;
            }

            let table = document.getElementById("tabellaDati");

            let row = table.insertRow(-1);

            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);
            let cell3 = row.insertCell(2);
            let cell4 = row.insertCell(3);
            let cell5 = row.insertCell(4);

            cell1.textContent = nome;
            cell2.textContent = cognome;
            cell3.textContent = indirizzo;
            cell4.textContent = citta;
            cell5.textContent = eta;

            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("indirizzo").value = "";
            document.getElementById("citta").value = "";
            document.getElementById("eta").value = "";
        }
    </script>

</body>
</html>
